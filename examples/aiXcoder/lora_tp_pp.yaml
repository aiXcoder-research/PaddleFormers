### data
train_dataset_type: erniekit
eval_dataset_type: erniekit
train_dataset_path: /workspace/3/data/sft/train.json
train_dataset_prob: "1.0"
eval_dataset_path: /workspace/3/data/sft/dev.json
eval_dataset_prob: "1.0"
max_seq_len: 8192
packing: true
mix_strategy: concat

### model
model_name_or_path: /workspace/aixcoder-7b-base-pd-converted
attn_impl: flashmask
lora: true
lora_rank: 8

### finetuning
# base
stage: SFT
fine_tuning: lora
seed: 23
do_train: true
do_eval: true
per_device_eval_batch_size: 1
per_device_train_batch_size: 1
num_train_epochs: 1
max_steps: 50
eval_steps: 50
evaluation_strategy: steps
save_steps: 50
save_strategy: steps
logging_steps: 1
gradient_accumulation_steps: 4
logging_dir: ./vdl_log
output_dir: ./checkpoints/aixcoder-7b-base-sft-lora-tp-pp
disable_tqdm: true
eval_accumulation_steps: 16

# train
warmup_steps: 20
learning_rate: 1.0e-4

# performance
tensor_parallel_degree: 8
pipeline_parallel_degree: 1
sequence_parallel: true
sharding: stage1
recompute: true
bf16: true
fp16_opt_level: O2
unified_checkpoint: true
